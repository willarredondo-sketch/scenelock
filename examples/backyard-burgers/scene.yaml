# Generic backyard meal. Put your own consented reference photos at the paths
# below. This folder ships no photos.

title: Backyard burgers
setting: a large wooden backyard table in warm afternoon light

aspect_ratio: "9:16"
image_resolution: "1K"
video_resolution: "720p"
duration: 8

image_model: gemini-3-pro-image-preview
video_model: seedance-1-5-pro-251215

refs:
  location: refs/location.png

characters:
  - name: Person A
    appearance: the man
    image: refs/person_a.png
    slot: left
    held_object: a burger
    held_hand: left
  - name: Person B
    appearance: the woman
    image: refs/person_b.png
    slot: right
    held_object: a burger
    held_hand: left

table_lock:
  - exactly one white plate in front of each person, with exactly one burger and a few fries on that plate
  - exactly one open unlabeled soda bottle with no cap, standing upright between the plates
  - exactly one paper napkin beside each plate
  - exactly one small ketchup cup, not two

start_pose: >
  They are relaxed, with closed-mouth smiles, mid-conversation.
  Neither person is eating yet. Each person holds exactly one burger in
  exactly one hand. The other hand is empty, open on the table, fully visible.

end_pose: >
  Both keep closed-mouth smiles: the man on the left places his right hand
  on the upper arm of the woman on the right; the woman's hands stay on her plate.
  He still holds exactly one burger in his left hand only. She still holds
  exactly one burger in her left hand only. The pose is a small, reachable motion.

motion_beat: >
  They chat with closed-mouth smiles. The man on the left slowly moves his
  free right hand off the table and rests it on the upper arm of the woman
  on the right. Her hands stay on her plate. No one else reaches.

# Optional [x, y, width, height] in start-frame pixels for the QA table crop.
table_bbox: null

seeds:
  start: [61001, 61011, 61021, 61031]
  end: [62011, 62021]
  video: [64001]
